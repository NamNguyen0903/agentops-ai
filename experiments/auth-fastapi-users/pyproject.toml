[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "agentops-auth-fastapi-users-poc"
version = "0.1.0"
description = "Isolated authentication compatibility experiment"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi-users==15.0.5",
    "fastapi-users-db-sqlalchemy==7.0.0",
    "fastapi==0.165.0",
    "starlette==1.10.0",
    "pydantic==2.14.4",
    "SQLAlchemy[asyncio]==2.0.58",
    "httpx==0.28.1",
    "pytest==9.2.0",
    "packaging==26.3",
]

[tool.setuptools]
packages = []

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers --tb=short --show-capture=no"
xfail_strict = true
log_cli = false
markers = ["contract(key): registered compatibility observation"]
