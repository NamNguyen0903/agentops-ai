
[build-system]
requires = ["setuptools>=84.1.0,<85"]
build-backend = "setuptools.build_meta"

[project]
name = "agentops-api"
version = "0.1.0"
description = "FastAPI backend for AgentOps AI"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.165.0,<1.0",
    "starlette>=1.10.0,<2.0",
    "uvicorn>=0.30,<1.0",
    "pydantic>=2.7,<3.0",
    "pydantic-settings>=2.2,<3.0",
    "psycopg[binary]>=3.2,<4.0",
    "SQLAlchemy[asyncio]>=2.0.40,<2.1",
    "alembic>=1.16,<2.0",
    "Authlib==1.9.10",
    "httpx2==2.16.2",
    "cryptography>=50.0.2,<52",
    "joserfc>=1.8.0,<2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8,<10",
    "httpx>=0.27,<1.0",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
include = ["agentops_api*"]
namespaces = false

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

markers = ["integration: requires explicitly disposable PostgreSQL infrastructure"]
