name: Backend CI

on:
  pull_request:
  push:
    branches:
      - main
      - "feat/**"

permissions:
  contents: read

jobs:
  backend-tests:
    name: Backend Tests
    runs-on: ubuntu-latest
    timeout-minutes: 10

    defaults:
      run:
        working-directory: apps/api

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --only-binary=:all: --require-hashes -r requirements/py311-linux-x86_64-dev.txt
          python -m pip install --no-deps --no-build-isolation ".[dev]"

      - name: Check dependency consistency
        run: python -m pip check

      - name: Run backend regression tests
        env:
          PYTEST_DISABLE_PLUGIN_AUTOLOAD: "1"
          AGENTOPS_RUN_DB_INTEGRATION: "0"
          AGENTOPS_RUN_LEGACY_COMPOSE_TESTS: "0"
        run: |
          python -m pytest -q --tb=short

  postgres-tests:
    name: PostgreSQL Lifecycle and Auth
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate isolated Compose configuration
        run: docker compose -f apps/api/tests/migration_lifecycle/compose.yaml config --quiet

      - name: Run migrations and PostgreSQL security tests
        run: >-
          docker compose
          -p s02-ci-${{ github.run_id }}-${{ github.run_attempt }}
          -f apps/api/tests/migration_lifecycle/compose.yaml
          up --abort-on-container-exit --exit-code-from runner

  oidc-poc:
    name: Offline Authlib Compatibility
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: experiments/auth-authlib-oidc
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install isolated experiment dependencies
        run: |
          python -m pip install --only-binary=:all: --require-hashes -r requirements/py312-linux-x86_64-poc-dev.txt
          python -m pip install --no-deps --no-build-isolation ".[dev]"
      - name: Check dependency consistency
        run: python -m pip check
      - name: Run offline compatibility tests
        env:
          PYTEST_DISABLE_PLUGIN_AUTOLOAD: "1"
        run: python -m pytest -q --tb=short

  frontend-tests:
    name: Frontend Tests and Build
    runs-on: ubuntu-latest
    timeout-minutes: 10

    defaults:
      run:
        working-directory: apps/web

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json

      - name: Install locked dependencies
        run: npm ci --include=dev --no-audit --no-fund

      - name: TypeScript typecheck
        run: npm run typecheck

      - name: ESLint
        run: npm run lint

      - name: Frontend regression tests
        run: npm test

      - name: Frontend production build
        run: npm run build

      - name: Verify dependency manifests
        run: git diff --exit-code -- package.json package-lock.json
